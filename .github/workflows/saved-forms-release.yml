name: Saved forms release checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    env:
      DATABASE_URL: postgresql://disabled:disabled@127.0.0.1:1/disabled
      NEXT_PUBLIC_STACK_PROJECT_ID: 00000000-0000-4000-8000-000000000000
      NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: pck_synthetic_ci_only
      STACK_SECRET_SERVER_KEY: ssk_synthetic_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Enable disposable native PostgreSQL tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "SAVED_FORMS_TEST_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - run: npm test -- --run
      - run: npm run build
      - run: npm exec tsc -- --noEmit
      - run: npm run security:scan
